name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          JWT_SECRET: "ci_test_dummy_signing_key_at_least_32_characters_long_for_security"
          JWT_EXPIRES_IN: "15m"
          JWT_ISSUER: "dinedesk-api"
          JWT_AUDIENCE: "dinedesk-client"
        run: npm test

      - name: Install readiness checker dependencies
        run: |
          cd readiness-check
          npm install
          cd ..

      - name: Run Production Readiness Check
        run: npm run check
