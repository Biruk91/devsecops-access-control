name: Verify Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm DINEDESK_DEMO_KEY is configured
        env:
          DINEDESK_DEMO_KEY: ${{ secrets.DINEDESK_DEMO_KEY }}
        run: |
          if [ -z "$DINEDESK_DEMO_KEY" ]; then
            echo "::error::DINEDESK_DEMO_KEY is not configured"
            exit 1
          fi
          echo "DINEDESK_DEMO_KEY is configured. Its value is not printed."
