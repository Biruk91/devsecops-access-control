name: dinedesk-production

services:
  proxy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: node:20.18.0-alpine
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/dinedesk
      DB_USER: ${APP_DB_USER}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - edge
      - data
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: dinedesk
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    restart: unless-stopped

networks:
  edge: {}
  data:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  db_data:
